<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waffenrad Entwurf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d12;
    --seg: rgba(16, 17, 23, 0.74);
    --seg-empty: rgba(16, 17, 23, 0.5);
    --seg-stroke: rgba(255, 255, 255, 0.10);
    --seg-active: rgba(119, 0, 166, 0.34);
    --seg-active-stroke: #a33fd6;
    --center: rgba(10, 11, 15, 0.86);
    --text: #e8e9ec;
    --muted: #8b8f99;
    --faint: #555a66;
    --accent: #7700a6;
    --font: 'Roboto', system-ui, sans-serif;
    --font-cond: 'Roboto Condensed', 'Roboto', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* Fake game scene so the translucent wheel can be judged against something */
  .scene {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 70% 18%, rgba(255, 170, 90, 0.28), transparent 70%),
      radial-gradient(ellipse 50% 35% at 20% 30%, rgba(90, 140, 220, 0.22), transparent 70%),
      linear-gradient(180deg, #2a3242 0%, #3b3f4a 45%, #1d1f25 46%, #15161a 100%);
    filter: blur(2px) saturate(0.9);
  }
  .scene::after {
    content: ''; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(90deg, transparent 0 7%, rgba(0,0,0,0.35) 7% 7.6%, transparent 7.6% 14%),
      linear-gradient(180deg, transparent 0 46%, rgba(255,255,255,0.03) 46% 100%);
    mask-image: linear-gradient(180deg, transparent 10%, #000 40%, #000 46%, transparent 47%);
  }

  .dim {
    position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.15), rgba(0,0,0,0.65) 75%);
    opacity: 0; transition: opacity 160ms ease;
    pointer-events: none;
  }
  body.open .dim { opacity: 1; }

  .stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    padding: 16px;
  }

  .wheel {
    position: relative;
    width: min(744px, 92vw, 90vh);
    aspect-ratio: 1;
    container-type: inline-size;
    opacity: 0;
    transform: scale(0.94);
    transition: opacity 140ms ease, transform 160ms cubic-bezier(.2,.8,.3,1);
    pointer-events: none;
  }
  body.open .wheel { opacity: 1; transform: scale(1); pointer-events: auto; }

  .wheel svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  .seg path.body {
    fill: var(--seg);
    stroke: var(--seg-stroke);
    stroke-width: 1;
    transition: fill 90ms ease, stroke 90ms ease;
    cursor: pointer;
  }
  .seg.empty path.body { fill: var(--seg-empty); }
  .seg path.rim { fill: transparent; transition: fill 90ms ease; pointer-events: none; }

  .seg.hover path.body { fill: var(--seg-active); stroke: var(--seg-active-stroke); stroke-width: 1.5; }
  .seg.hover path.rim { fill: var(--accent); }
  .seg.equipped:not(.hover) path.rim { fill: rgba(255,255,255,0.35); }

  /* Empty segments can not be selected */
  .seg.disabled path.body { cursor: default; }

  .center-disc { fill: var(--center); stroke: rgba(255,255,255,0.08); stroke-width: 1; }
  .center-ring { fill: none; stroke: rgba(163, 63, 214, 0.4); stroke-width: 1; stroke-dasharray: 2 6; }

  /* HTML labels positioned on top of the svg segments */
  .label {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 30cqw;
    display: flex; flex-direction: column; align-items: center; gap: 0.6cqw;
    pointer-events: none;
    transition: transform 120ms ease;
  }
  .label.hover { transform: translate(-50%, -50%) scale(1.06); }

  .label .icon {
    width: 19cqw; height: 12cqw;
    display: grid; place-items: center;
  }
  .label .icon img {
    width: 19cqw; height: 12cqw;
    object-fit: contain;
    filter: drop-shadow(0 0.4cqw 0.8cqw rgba(0,0,0,0.6));
    opacity: 0.9;
  }
  .label.hover .icon img { opacity: 1; }
  .label .icon .fallback {
    font-family: var(--font-cond); font-weight: 700;
    font-size: 2.2cqw; letter-spacing: 0.08em; color: var(--muted);
  }
  .label .icon svg { position: static; width: 8.5cqw; height: 8.5cqw; color: var(--text); opacity: 0.85; }
  .label.hover .icon svg { opacity: 1; }

  .label .ammo {
    font-family: var(--font-cond); font-weight: 700;
    font-size: 2.5cqw; letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }
  .label .ammo span { color: var(--muted); font-weight: 500; }

  .label .empty-text {
    font-family: var(--font-cond); font-weight: 500;
    font-size: 2.3cqw; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--faint);
  }
  .label .empty-icon {
    width: 7cqw; height: 7cqw; border-radius: 50%;
    border: 0.3cqw dashed var(--faint);
  }

  .slotno {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: none;
    width: 4cqw; height: 4cqw;
    display: grid; place-items: center;
    font-family: var(--font-cond); font-weight: 700; font-size: 2.1cqw;
    color: var(--muted);
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 50%;
    transition: color 90ms ease, background 90ms ease, border-color 90ms ease;
  }
  .slotno.hover { color: #fff; background: var(--accent); border-color: var(--accent); }

  /* Center info panel */
  .info {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 38cqw;
    text-align: center;
    pointer-events: none;
    display: flex; flex-direction: column; align-items: center;
  }
  .info .name {
    font-family: var(--font-cond); font-weight: 700;
    font-size: 3.6cqw; line-height: 1.1;
    max-width: 30cqw;
  }
  .info .ammo {
    margin-top: 1.6cqw;
    font-family: var(--font-cond); font-weight: 700;
    font-size: 5cqw; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .info .ammo span { font-size: 2.8cqw; color: var(--muted); font-weight: 500; }
  /* Fixed tile size, wraps after 3 tiles per row (last row centered) */
  .info .comps {
    --tile: 6.4cqw;
    --gap: 0.8cqw;
    margin-top: 1.8cqw;
    max-width: calc(var(--tile) * 3 + var(--gap) * 2);
    display: flex; flex-wrap: wrap; justify-content: center; gap: var(--gap);
  }
  .info .comp-tile {
    width: var(--tile); height: var(--tile);
    display: grid; place-items: center;
    border-radius: calc(var(--tile) * 0.18);
    animation: comp-in 180ms cubic-bezier(.2,.8,.3,1) both;
    background:
      radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.10), transparent 70%),
      rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 0 1.2cqw rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  .info .comp-tile:nth-child(2) { animation-delay: 40ms; }
  .info .comp-tile:nth-child(3) { animation-delay: 80ms; }
  .info .comp-tile:nth-child(4) { animation-delay: 120ms; }
  .info .comp-tile:nth-child(5) { animation-delay: 160ms; }
  .info .comp-tile img {
    width: calc(var(--tile) * 0.82); height: calc(var(--tile) * 0.82);
    object-fit: contain;
    filter: drop-shadow(0 0.3cqw 0.5cqw rgba(0, 0, 0, 0.6));
  }
  @keyframes comp-in {
    from { opacity: 0; transform: translateY(0.8cqw) scale(0.9); }
    to { opacity: 1; transform: none; }
  }

  /* Game mode: wheel hidden until Tab is held */
  .idle-hint {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--font-cond); font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    font-size: 15px;
    display: none;
  }
  body.game:not(.open) .idle-hint { display: block; }
  kbd {
    font-family: var(--font-cond); font-weight: 700;
    display: inline-block; min-width: 1.9em;
    padding: 0.15em 0.5em; margin: 0 0.15em;
    border-radius: 4px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-bottom-width: 2px;
    color: var(--text); text-align: center;
  }

  /* Equipped weapon HUD bottom right, like a game would show it */
  .hud {
    position: fixed; right: 24px; bottom: 24px;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 14px 10px 10px;
    background: rgba(0,0,0,0.45);
    border-radius: 8px;
    border-left: 3px solid var(--accent);
    min-width: 200px;
  }
  .hud .hud-icon { width: 56px; height: 56px; display: grid; place-items: center; }
  .hud .hud-icon img { width: 56px; height: 56px; object-fit: contain; }
  .hud .hud-icon svg { width: 34px; height: 34px; color: var(--text); }
  .hud .hud-name { font-family: var(--font-cond); font-weight: 700; font-size: 15px; }
  .hud .hud-ammo { font-family: var(--font-cond); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .toast {
    position: fixed; left: 50%; bottom: 28px;
    transform: translate(-50%, 12px);
    padding: 9px 16px;
    border-radius: 6px;
    background: rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.1);
    font-size: 14px;
    opacity: 0;
    transition: opacity 160ms ease, transform 160ms ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { border-color: rgba(255,92,92,0.5); color: #ffb3b3; }

  /* Design controls, not part of the in-game ui */
  .controls {
    position: fixed; left: 16px; top: 16px;
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px 14px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    font-size: 13px; color: var(--muted);
    max-width: 280px;
  }
  .controls .title { color: var(--text); font-weight: 500; font-size: 13px; }
  .controls label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text); }
  .controls input { accent-color: var(--accent); }
  .controls .keys { line-height: 1.9; }
  .controls .keys kbd { font-size: 11px; }

  @media (max-width: 640px) {
    .controls { top: auto; bottom: 16px; left: 16px; right: 16px; max-width: none; }
    .controls .keys { display: none; }
    .hud { display: none; }
    .toast { bottom: 150px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body class="open">
  <div class="scene"></div>
  <div class="dim"></div>

  <div class="stage">
    <div class="wheel" id="wheel">
      <svg viewBox="-300 -300 600 600" id="wheelSvg" aria-hidden="true"></svg>
      <div id="labels"></div>
      <div class="info" id="info"></div>
    </div>
  </div>

  <div class="idle-hint"><kbd>Tab</kbd> gedrückt halten, um das Waffenrad zu öffnen</div>

  <div class="hud" id="hud"></div>
  <div class="toast" id="toast"></div>

  <div class="controls">
    <div class="title">Waffenrad Entwurf</div>
    <label><input type="checkbox" id="gameMode"> Spielmodus: <kbd>Tab</kbd> halten</label>
    <div class="keys">
      Maus: Slot wählen<br>
      Klick / <kbd>Tab</kbd> loslassen: ausrüsten<br>
      <kbd>1</kbd>-<kbd>5</kbd> Slot, <kbd>6</kbd> Faust<br>
      <kbd>Esc</kbd> abbrechen (Spielmodus)
    </div>
  </div>

<script>
  // Demo data, mirrors what ox_inventory would send via NUI (slot, name, metadata)
  const IMG = '../web/images/';

  const slots = [
    { slot: 1, name: 'WEAPON_CARBINERIFLE', label: 'Karabiner', ammo: 30, reserve: 120, durability: 87, serial: 'CR-48213', components: ['at_scope_medium', 'at_flashlight', 'at_grip', 'at_clip_extended_rifle', 'at_suppressor_heavy'] },
    { slot: 2, name: 'WEAPON_PISTOL', label: 'Pistole', ammo: 12, reserve: 36, durability: 64, serial: 'PI-10492', components: [] },
    { slot: 3, name: 'WEAPON_PUMPSHOTGUN', label: 'Pump-Schrotflinte', ammo: 6, reserve: 14, durability: 18, serial: 'SG-77120', components: [] },
    null,
    { slot: 5, name: 'WEAPON_PISTOL', label: 'Pistole', ammo: 9, reserve: 36, durability: 95, serial: 'PI-55871', components: ['at_suppressor_light', 'at_flashlight'] },
  ];

  // Image overrides from data/weapons.lua Components (default is <name>.png)
  const COMPONENT_IMAGES = {
    at_suppressor_light: 'at_suppressor',
    at_suppressor_heavy: 'at_suppressor',
    at_clip_extended_rifle: 'at_clip_extended2',
  };

  // Index 0-4 = slot 1-5, index 5 = fist. Angle 0 = top, clockwise.
  const ANGLES = [240, 300, 0, 60, 120, 180];
  const FIST = 5;

  const R_IN = 132, R_OUT = 276, RIM_IN = 282, RIM_OUT = 288, GAP = 6;
  const LABEL_R = (R_IN + R_OUT) / 2 + 14;
  const SLOTNO_R = R_IN + 18;

  const FIST_SVG = `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M16 31V22a4 4 0 0 1 8 0v6"/>
    <path d="M24 26v-8a4 4 0 0 1 8 0v8"/>
    <path d="M32 26v-7a4 4 0 0 1 8 0v8"/>
    <path d="M40 27v-4a4 4 0 0 1 8 0v15c0 9-6 16-15 16h-3c-8 0-14-6-14-14v-9"/>
    <path d="M16 36h11a4 4 0 0 1 0 8h-5"/>
  </svg>`;

  let hovered = FIST;
  let equipped = FIST;
  let gameMode = false;

  const $ = (id) => document.getElementById(id);
  const svg = $('wheelSvg');
  const labelsEl = $('labels');

  const rad = (deg) => deg * Math.PI / 180;
  const pt = (r, a) => [r * Math.sin(a), -r * Math.cos(a)];

  // Annular sector with a constant pixel gap between neighbours
  function sector(centerDeg, spanDeg, r0, r1, gap) {
    const a0 = rad(centerDeg - spanDeg / 2), a1 = rad(centerDeg + spanDeg / 2);
    const g0 = gap / 2 / r0, g1 = gap / 2 / r1;
    const [x1, y1] = pt(r1, a0 + g1), [x2, y2] = pt(r1, a1 - g1);
    const [x3, y3] = pt(r0, a1 - g0), [x4, y4] = pt(r0, a0 + g0);
    return `M${x1} ${y1}A${r1} ${r1} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r0} ${r0} 0 0 0 ${x4} ${y4}Z`;
  }

  const pos = (r, deg) => {
    const [x, y] = pt(r, rad(deg));
    return { left: `${(x + 300) / 6}%`, top: `${(y + 300) / 6}%` };
  };


  function itemAt(i) {
    if (i === FIST) return { fist: true, label: 'Faust' };
    return slots[i];
  }

  // Empty slots are not selectable
  function isAvailable(i) {
    return i !== null && !!itemAt(i);
  }

  // Nearest selectable segment by angle, ties go clockwise (= next slot number)
  function nearestAvailable(deg) {
    let best = null, bestDist = Infinity;
    ANGLES.forEach((a, i) => {
      if (!isAvailable(i)) return;
      const cw = ((a - deg) % 360 + 360) % 360;
      const dist = Math.min(cw, 360 - cw) - (cw <= 180 ? 0.001 : 0);
      if (dist < bestDist) { best = i; bestDist = dist; }
    });
    return best;
  }

  function iconHtml(item) {
    if (item.fist) return FIST_SVG;
    const short = item.name.replace('WEAPON_', '').slice(0, 10);
    return `<img src="${IMG}${item.name}.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fallback',textContent:'${short}'}))">`;
  }

  function build() {
    const ns = 'http://www.w3.org/2000/svg';
    svg.innerHTML = `<circle class="center-disc" r="${R_IN - 10}"/><circle class="center-ring" r="${R_IN - 16}"/>`;
    labelsEl.innerHTML = '';

    ANGLES.forEach((deg, i) => {
      const item = itemAt(i);
      const g = document.createElementNS(ns, 'g');
      g.setAttribute('class', 'seg' + (item ? '' : ' empty'));
      g.dataset.index = i;
      g.innerHTML = `<path class="body" d="${sector(deg, 60, R_IN, R_OUT, GAP)}"/>
                     <path class="rim" d="${sector(deg, 60, RIM_IN, RIM_OUT, GAP)}"/>`;
      g.addEventListener('click', () => { if (isAvailable(i)) equip(i); });
      svg.appendChild(g);

      const label = document.createElement('div');
      label.className = 'label';
      label.dataset.index = i;
      Object.assign(label.style, pos(LABEL_R, deg));

      if (!item) {
        label.innerHTML = `<div class="icon"><div class="empty-icon"></div></div><div class="empty-text">Leer</div>`;
      } else if (item.fist) {
        label.innerHTML = `<div class="icon">${iconHtml(item)}</div><div class="ammo">Faust</div>`;
      } else {
        label.innerHTML = `
          <div class="icon">${iconHtml(item)}</div>
          <div class="ammo">${item.ammo}<span> / ${item.reserve}</span></div>`;
      }
      labelsEl.appendChild(label);

      // Slot number sits on the inner edge, centered on the segment
      if (i !== FIST) {
        const no = document.createElement('div');
        no.className = 'slotno';
        no.dataset.index = i;
        no.textContent = i + 1;
        Object.assign(no.style, pos(SLOTNO_R, deg));
        labelsEl.appendChild(no);
      }
    });

    update();
  }

  function update() {
    document.querySelectorAll('[data-index]').forEach((el) => {
      const i = Number(el.dataset.index);
      el.classList.toggle('hover', i === hovered);
      el.classList.toggle('equipped', i === equipped);
      el.classList.toggle('disabled', !isAvailable(i));
    });
    renderInfo();
    renderHud();
  }

  function renderInfo() {
    const item = itemAt(hovered);
    const info = $('info');

    if (!item) {
      info.innerHTML = `
        <div class="name" style="color:var(--muted)">Leer</div>`;
      return;
    }

    if (item.fist) {
      info.innerHTML = `
        <div class="name">Faust</div>`;
      return;
    }

    const comps = item.components.length
      ? `<div class="comps">${item.components.map((name) =>
          `<div class="comp-tile"><img src="${IMG}${COMPONENT_IMAGES[name] || name}.png" alt=""></div>`
        ).join('')}</div>`
      : '';

    info.innerHTML = `
      <div class="name">${item.label}</div>
      <div class="ammo">${item.ammo}<span> / ${item.reserve}</span></div>
      ${comps}`;
  }

  function renderHud() {
    const item = itemAt(equipped);
    $('hud').innerHTML = item.fist
      ? `<div class="hud-icon">${FIST_SVG}</div><div><div class="hud-name">Faust</div><div class="hud-ammo">Unbewaffnet</div></div>`
      : `<div class="hud-icon">${iconHtml(item)}</div><div><div class="hud-name">${item.label}</div><div class="hud-ammo">${item.ammo} / ${item.reserve} &middot; Slot ${item.slot}</div></div>`;
  }

  let toastTimer;
  function toast(msg, error = false) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.toggle('error', error);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  function equip(i) {
    if (!isAvailable(i)) return false;
    // Selecting the current weapon keeps it, so the wheel can be closed without switching
    if (i === equipped) return true;
    const item = itemAt(i);
    equipped = i;
    toast(item.fist ? 'Waffe weggesteckt' : `${item.label} ausgerüstet (Slot ${item.slot})`);
    update();
    return true;
  }

  // Unavailable targets snap to the nearest available segment
  function setHover(i) {
    if (!isAvailable(i)) i = nearestAvailable(ANGLES[i]);
    if (i === hovered) return;
    hovered = i;
    update();
  }

  // Select by direction from the wheel center, like a gamepad stick or mouse delta in game
  document.addEventListener('mousemove', (e) => {
    if (!document.body.classList.contains('open')) return;
    const r = $('wheel').getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    if (Math.hypot(dx, dy) < r.width * 0.12) return;
    let deg = Math.atan2(dx, -dy) * 180 / Math.PI;
    if (deg < 0) deg += 360;
    const i = nearestAvailable(deg);
    if (i !== hovered) { hovered = i; update(); }
  });

  function setOpen(open) {
    document.body.classList.toggle('open', open);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      if (gameMode && !e.repeat) {
        hovered = equipped;
        update();
        setOpen(true);
      }
      return;
    }
    if (!document.body.classList.contains('open')) return;
    if (e.key >= '1' && e.key <= '6') setHover(Number(e.key) - 1);
    if (e.key === 'Enter' && !gameMode) equip(hovered);
    if (e.key === 'Escape' && gameMode) setOpen(false);
  });

  document.addEventListener('keyup', (e) => {
    if (e.key !== 'Tab' || !gameMode) return;
    e.preventDefault();
    if (document.body.classList.contains('open')) {
      equip(hovered);
      setOpen(false);
    }
  });

  $('gameMode').addEventListener('change', (e) => {
    gameMode = e.target.checked;
    document.body.classList.toggle('game', gameMode);
    setOpen(!gameMode);
    e.target.blur();
  });

  // #1 - #6 in the url preselects a segment (handy for screenshots)
  const fromHash = Number(location.hash.slice(1));
  hovered = nearestAvailable(ANGLES[fromHash >= 1 && fromHash <= 6 ? fromHash - 1 : equipped]);

  build();
</script>
</body>
</html>
